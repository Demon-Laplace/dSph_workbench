# Fornax8002: rotation-dominated, finite-thickness cold stellar disk candidate.
# Parent radial/mass recipe: Fornax8001 (originally Fornax5028).
# Thin stellar density, near-maximal streaming, finite radial pressure for Q.
# No spherical beta-second target: beta=-0.1 would keep this disk radially hot.
# A rotating seed is not a final cold/stable model: measure the optimized IC.
# Isolation only; gas recipe, masses and particle numbers are held fixed.

[Density_gas]
type=disk
mass=0.0145
sersicIndex=1
scaleRadius=0.9
scaleHeight=-0.45

[Density_stellar]
type=Sersic
mass=0.006
sersicIndex=0.6
scaleRadius=0.54
axisRatioZ=0.12

[Potential_gas]
density=Density_gas
type=cylspline
mmax=0
gridsizer=30
gridsizez=25
rmin=0.02
rmax=40
zmin=0.02
zmax=12

[Potential_stellar]
density=Density_stellar
type=cylspline
mmax=0
gridsizer=40
gridsizez=35
rmin=0.01
rmax=20
zmin=0.005
zmax=6

[Component_gas]
density=Density_gas
type=DensityCylindricalLinear
gridR=agama.nonuniformGrid(30, 0.02, 40)
gridZ=agama.nonuniformGrid(25, 0.02, 12)
mmax=0
icbeta=0.0
ickappa=0.85
intTime=100
trajsize=1000
numOrbits=10000
nbody=14500

[Component_stellar]
density=Density_stellar
type=DensityClassicLinear
gridr=agama.nonuniformGrid(40, 0.01, 10)
stripsPerPane=2
axisRatioZ=0.12
icbeta=0.65
ickappa=1.0
intTime=100
numOrbits=30000
trajsize=400
nbody=600000
