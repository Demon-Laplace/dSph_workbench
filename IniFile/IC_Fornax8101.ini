# Fornax8101: inherit the Fornax8100 rotating thin-gas model.
# Stellar mass is 4.5e7 Msun, sampled with 450000 particles (100 Msun each).
# Gas remains 1.45e8 Msun, 14500 particles, Rd=0.9 kpc, h=-0.09 kpc.
# Density geometry, orbit-library sizes, anisotropy and streaming seeds are unchanged.
# Rebuild both components in the new combined potential.
# Orbit-based IC candidate; no hydrodynamic equilibrium or long-term stability claim.

[Density_gas]
type=disk
mass=0.0145
sersicIndex=1
scaleRadius=0.9
scaleHeight=-0.09

[Density_stellar]
type=Sersic
mass=0.0045
sersicIndex=0.6
scaleRadius=0.54
axisRatioZ=0.12

[Potential_gas]
density=Density_gas
type=cylspline
mmax=0
gridsizer=30
gridsizez=35
rmin=0.02
rmax=40
zmin=0.005
zmax=12

[Potential_stellar]
density=Density_stellar
type=cylspline
mmax=0
gridsizer=40
gridsizez=35
rmin=0.01
rmax=20
zmin=0.005
zmax=6

[Component_gas]
density=Density_gas
type=DensityCylindricalLinear
gridR=agama.nonuniformGrid(30, 0.02, 40)
gridZ=agama.nonuniformGrid(35, 0.005, 12)
mmax=0
icbeta=0.0
ickappa=1.0
intTime=100
trajsize=1000
numOrbits=10000
nbody=14500

[Component_stellar]
density=Density_stellar
type=DensityClassicLinear
gridr=agama.nonuniformGrid(40, 0.01, 10)
stripsPerPane=2
axisRatioZ=0.12
icbeta=0.65
ickappa=1.0
intTime=100
numOrbits=30000
trajsize=400
nbody=450000
